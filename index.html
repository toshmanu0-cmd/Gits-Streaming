<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e50914">
<title>TrailerFlix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1 class="logo">GITS STREAMING</h1>
<input id="searchInput" type="text" placeholder="Search movies">
<button id="searchBtn">Search</button>

<div id="gallery"></div>
</header>
<div id="hero">
  <div id="heroContent">
    <h2>Welcome to GITS STREAMING</h2>
    <p>Watch the latest movie trailers&Movies instantly.</p>
  </div>
</div>
<h2 class="categoryTitle">🔥 Trending</h2>
<section id="trending" class="movie-row"></section>

<h2 class="categoryTitle">🎬 Action</h2>
<section id="action" class="movie-row"></section>

<h2 class="categoryTitle">😂 Comedy</h2>
<section id="comedy" class="movie-row"></section>

<h2 class="categoryTitle">👻 Horror</h2>
<section id="horror" class="movie-row"></section>

<h2 class="categoryTitle">🎨 Animation</h2>
<section id="animation" class="movie-row"></section>

<h2 class="categoryTitle">🗺 Adventure</h2>
<section id="adventure" class="movie-row"></section>

<h2 class="categoryTitle">🚀 Sci-Fi</h2>
<section id="scifi" class="movie-row"></section>

<h2 class="categoryTitle">💕 Romance</h2>
<section id="romance" class="movie-row"></section>

<h2 class="categoryTitle">🕵 Thriller</h2>
<section id="thriller" class="movie-row"></section>

<h2 class="categoryTitle">🧙 Fantasy</h2>
<section id="fantasy" class="movie-row"></section>

<h2 class="categoryTitle">🔍 Mystery</h2>
<section id="mystery" class="movie-row"></section>

<h2 class="categoryTitle">⚔ War</h2>
<section id="war" class="movie-row"></section>

<h2 class="categoryTitle">👨‍👩‍👧 Family</h2>
<section id="family" class="movie-row"></section>

<h2 class="categoryTitle">📖 Drama</h2>
<section id="drama" class="movie-row"></section>

<h2 class="categoryTitle">🤠 Western</h2>
<section id="western" class="movie-row"></section>

<h2 class="categoryTitle">🔫 Crime</h2>
<section id="crime" class="movie-row"></section>

<div id="playerModal">
<div id="playerContainer">
<span id="closePlayer">×</span>
<iframe id="player" allowfullscreen></iframe>
</div>
</div>

<script src="app.js"></script>

</body>
</html>
